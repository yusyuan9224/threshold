name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Architecture boundaries
        run: scripts/check-boundaries.sh
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
