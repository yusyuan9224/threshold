name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Architecture boundaries
        run: scripts/check-boundaries.sh
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: App bundle
        run: scripts/make-app-bundle.sh debug
      - name: Tools build
        run: |
          swift build --package-path Tools/rssi-record
          swift build --package-path Tools/app-smoke
